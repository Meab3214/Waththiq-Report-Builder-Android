name: Inspect WASM patched source
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: wasm-inspect-source
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          cat bundle.part01.b64 bundle.part02.b64 bundle.part03.b64 | base64 --decode > /tmp/source.tar.xz
          tar -xJf /tmp/source.tar.xz
      - name: Apply current patches
        run: |
          python3 scripts/apply_source_branding.py
          python3 scripts/apply_modal_flow.py
          python3 scripts/apply_android_mobile_fixes.py
          python3 scripts/fix_build_issues.py --source
          python3 scripts/apply_mobile_v2.py
          python3 scripts/apply_mobile_v3.py
          python3 scripts/apply_mobile_v4.py
          python3 scripts/apply_mobile_v5.py
          python3 scripts/fix_mobile_v5_types.py
          python3 scripts/apply_mobile_v6.py
          python3 scripts/apply_mobile_v8.py
          python3 scripts/fix_mobile_v8.py
      - name: Package patched source
        run: |
          tar -czf patched-source.tgz src package.json package-lock.json 2>/dev/null || tar -czf patched-source.tgz src package.json
      - uses: actions/upload-artifact@v4
        with:
          name: WASM-patched-source
          path: patched-source.tgz
          retention-days: 7

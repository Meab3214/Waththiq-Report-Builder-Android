name: Check WASM AI server credentials
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check credential presence without exposing values
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY" || test -n "$GOOGLE_GENERATIVE_AI_API_KEY" && echo "GEMINI_SECRET_PRESENT=true" || echo "GEMINI_SECRET_PRESENT=false"
          test -n "$VERCEL_TOKEN" && echo "VERCEL_TOKEN_PRESENT=true" || echo "VERCEL_TOKEN_PRESENT=false"
          test -n "$AI_GATEWAY_API_KEY" && echo "AI_GATEWAY_KEY_PRESENT=true" || echo "AI_GATEWAY_KEY_PRESENT=false"

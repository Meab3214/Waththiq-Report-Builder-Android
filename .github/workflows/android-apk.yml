name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact uploaded source
        run: |
          cat bundle.part01.b64 bundle.part02.b64 bundle.part03.b64 | base64 --decode > /tmp/waththiq-source.tar.xz
          tar -xJf /tmp/waththiq-source.tar.xz
          test -f package.json
          test -d src
          test -d public

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Build exact web interface
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync web build into Android
        run: npx cap sync android

      - name: Keep app controls above Android navigation bar
        run: |
          cat > android/app/src/main/java/com/waththiq/reports/MainActivity.java <<'JAVA'
          package com.waththiq.reports;

          import android.os.Bundle;
          import android.view.View;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  View webView = getBridge().getWebView();
                  ViewCompat.setOnApplyWindowInsetsListener(webView, (view, windowInsets) -> {
                      Insets systemBars = windowInsets.getInsets(WindowInsetsCompat.Type.systemBars());
                      view.setPadding(
                          view.getPaddingLeft(),
                          view.getPaddingTop(),
                          view.getPaddingRight(),
                          systemBars.bottom
                      );
                      return windowInsets;
                  });
                  ViewCompat.requestApplyInsets(webView);
              }
          }
          JAVA

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Waththiq-Report-Builder-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Waththiq-Report-Builder-Android-APK
          path: Waththiq-Report-Builder-Android.apk
          if-no-files-found: error
          retention-days: 30

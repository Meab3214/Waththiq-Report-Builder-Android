name: Build WASM Android APK

concurrency:
  group: wasm-android-main
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore original AI Studio source
        run: |
          cat bundle.part01.b64 bundle.part02.b64 bundle.part03.b64 | base64 --decode > /tmp/waththiq-source.tar.xz
          tar -xJf /tmp/waththiq-source.tar.xz
          test -f package.json
          test -d src
          test -d public

      - name: Verify official WASM source images
        run: |
          test -f public/assets/branding/wasm_app_icon.png
          test -f public/assets/branding/wasm_splash.png
          echo "e31d2d96c7465771fd02853455fdf626768ea9e5b7ae32331c93e15da11222ef  public/assets/branding/wasm_app_icon.png" | sha256sum -c -
          echo "58b1ccc43e4b6594862e78266b09e0bac928a6b2eeac1ccb7121f7b34de68598  public/assets/branding/wasm_splash.png" | sha256sum -c -

      - name: Apply WASM visual identity
        run: python3 scripts/apply_source_branding.py

      - name: Apply five-step modal flow
        run: python3 scripts/apply_modal_flow.py

      - name: Apply Android mobile-first v3 fixes
        run: |
          python3 scripts/apply_android_mobile_fixes.py
          python3 scripts/fix_build_issues.py --source
          python3 scripts/apply_mobile_v2.py
          python3 scripts/apply_mobile_v3.py
          grep -q 'إتمام وحفظ التقرير' src/components/Editor/StepEditorModal.tsx
          grep -q 'تحرير البيانات' src/App.tsx
          grep -q 'عودة للتحرير' src/App.tsx
          grep -q 'اللون والخط' src/App.tsx
          grep -q 'saveNativeDataUrl' src/App.tsx
          grep -q 'تقرير برنامج أو فعالية' src/App.tsx
          grep -q 'Gemini مباشر' src/components/Editor/AIEducationalAssistant.tsx
          grep -q 'setGeminiKey' src/components/Editor/AIEducationalAssistant.tsx

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install branding image tool
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow==11.3.0

      - name: Generate Web and PWA branding assets
        run: |
          python3 scripts/generate_branding_assets.py
          python3 scripts/generate_developer_mark.py
          test -f public/assets/branding/wasm_developer_mark.png

      - name: Verify official branding and responsive splash
        run: python3 scripts/verify_branding.py

      - name: Install dependencies
        run: npm install

      - name: TypeScript lint/typecheck
        run: npm run lint

      - name: Build Web application
        run: npm run build

      - name: Create clean Android wrapper
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Web build into Android
        run: npx cap sync android

      - name: Generate Android WASM resources
        run: python3 scripts/generate_branding_assets.py --android-dir android

      - name: Restore stable release signing key
        run: |
          base64 --decode signing/wasm-release.jks.b64 > android/wasm-release.jks
          echo "f7a2cacfb48cca4841e711aaa4d1f11bce2aec22285f37fb6654add585e0a5a6  android/wasm-release.jks" | sha256sum -c -

      - name: Apply Android native v3 bridge and stable versioning
        run: |
          python3 scripts/apply_android_native.py
          python3 scripts/apply_android_native_v2.py
          python3 scripts/apply_android_native_v3.py
          python3 scripts/fix_build_issues.py --android

      - name: Verify Android native integration
        run: |
          grep -q 'WasmNativePlugin' android/app/src/main/java/com/waththiq/reports/MainActivity.java
          grep -q '@CapacitorPlugin(name = "WasmNative")' android/app/src/main/java/com/waththiq/reports/WasmNativePlugin.java
          grep -q 'startFile(PluginCall call)' android/app/src/main/java/com/waththiq/reports/WasmNativePlugin.java
          grep -q 'finishFile(PluginCall call)' android/app/src/main/java/com/waththiq/reports/WasmNativePlugin.java
          grep -q 'generativelanguage.googleapis.com' android/app/src/main/java/com/waththiq/reports/WasmNativePlugin.java
          grep -q 'signingConfig signingConfigs.release' android/app/build.gradle
          grep -q 'storeFile file("../wasm-release.jks")' android/app/build.gradle
          grep -q 'وَسْم' android/app/src/main/res/values/strings.xml

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk WASM-Android-Mobile-v3-Release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WASM-Android-Mobile-v3-Release
          path: WASM-Android-Mobile-v3-Release.apk
          if-no-files-found: error
          retention-days: 30

name: Build WASM Android APK

concurrency:
  group: wasm-android-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/wasm-branding

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore original AI Studio source
        run: |
          cat bundle.part01.b64 bundle.part02.b64 bundle.part03.b64 | base64 --decode > /tmp/waththiq-source.tar.xz
          tar -xJf /tmp/waththiq-source.tar.xz
          test -f package.json
          test -d src
          test -d public

      - name: Restore exact official WASM images
        run: |
          mkdir -p public/assets/branding
          cat branding_upload/icon.*.b64 | tr -d '\r\n' | base64 --decode > public/assets/branding/wasm_app_icon.png
          cat branding_upload/splash.*.b64 | tr -d '\r\n' | base64 --decode > public/assets/branding/wasm_splash.png
          echo "e31d2d96c7465771fd02853455fdf626768ea9e5b7ae32331c93e15da11222ef  public/assets/branding/wasm_app_icon.png" | sha256sum -c -
          echo "58b1ccc43e4b6594862e78266b09e0bac928a6b2eeac1ccb7121f7b34de68598  public/assets/branding/wasm_splash.png" | sha256sum -c -

      - name: Persist official source images in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/assets/branding/wasm_app_icon.png public/assets/branding/wasm_splash.png
          if ! git diff --cached --quiet; then
            git commit -m "feat: add WASM official branding source assets"
            git push origin HEAD:feat/wasm-branding
          fi

      - name: Apply WASM visual identity only
        run: python3 scripts/apply_source_branding.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install branding image tool
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir Pillow==11.3.0

      - name: Generate Web and PWA branding assets
        run: python3 scripts/generate_branding_assets.py

      - name: Verify official branding and responsive splash
        run: python3 scripts/verify_branding.py

      - name: Install dependencies
        run: npm install

      - name: TypeScript lint/typecheck
        run: npm run lint

      - name: Build Web application
        run: npm run build

      - name: Create clean Android wrapper
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Web build into Android
        run: npx cap sync android

      - name: Generate Android WASM resources
        run: python3 scripts/generate_branding_assets.py --android-dir android

      - name: Verify Android WASM resources
        run: |
          grep -q 'وَسْم' android/app/src/main/res/values/strings.xml
          grep -q 'wasm_brand_dark' android/app/src/main/res/values/styles.xml
          grep -q 'windowSplashScreenAnimatedIcon' android/app/src/main/res/values-v31/styles.xml
          grep -q 'core-splashscreen' android/app/build.gradle
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WASM-Android-Debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WASM-Android-APK
          path: WASM-Android-Debug.apk
          if-no-files-found: error
          retention-days: 30

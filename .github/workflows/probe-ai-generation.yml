name: Probe WASM AI generation
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: wasm-ai-generation-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe generation bodies
        run: |
          set +e
          for BASE in https://wasm-ai-sdk-v10.vercel.app https://wasm-ai-public-v9.vercel.app https://wasm-ai-prod.vercel.app https://wasm-ai-public.vercel.app; do
            echo "===== $BASE HEALTH"
            curl -sS -D /tmp/h -o /tmp/b "$BASE/api/health"
            cat /tmp/h | tail -15
            cat /tmp/b; echo
            echo "===== $BASE AI"
            curl -sS -D /tmp/h -o /tmp/b --connect-timeout 10 --max-time 90               -H 'Content-Type: application/json'               -d '{"title":"أسبوع الصحة المدرسية","reportType":"برنامج","targetAudience":"الطلاب"}'               "$BASE/api/ai/generate-content"
            cat /tmp/h | tail -15
            echo BODY:
            cat /tmp/b; echo
          done
          exit 0

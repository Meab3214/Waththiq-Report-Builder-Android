name: Verify WASM AI generation
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: wasm-ai-generation
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public Gemini generation
        run: |
          set -euo pipefail
          BASE='https://wasm-ai-gateway.vercel.app'
          echo '--- HEALTH ---'
          HEALTH="$(curl -L --connect-timeout 10 --max-time 30 -sS -w '\nHTTP_STATUS:%{http_code}\nCONTENT_TYPE:%{content_type}\n' "$BASE/api/health" || true)"
          echo "$HEALTH"
          HSTATUS="$(printf '%s' "$HEALTH" | sed -n 's/^HTTP_STATUS://p' | tail -1)"
          HCTYPE="$(printf '%s' "$HEALTH" | sed -n 's/^CONTENT_TYPE://p' | tail -1)"
          HBODY="$(printf '%s' "$HEALTH" | sed '/^HTTP_STATUS:/,$d')"
          [ "$HSTATUS" = '200' ]
          printf '%s' "$HCTYPE" | grep -qi 'application/json'
          printf '%s' "$HBODY" | grep -q '"ok":true'
          echo '--- GENERATION ---'
          AI="$(curl -L --connect-timeout 10 --max-time 90 -sS -w '\nHTTP_STATUS:%{http_code}\nCONTENT_TYPE:%{content_type}\n'             -H 'Content-Type: application/json'             -d '{"title":"برنامج القراءة الواعية","reportType":"تقرير برنامج","targetAudience":"طلاب المرحلة المتوسطة","category":"تعليمي"}'             "$BASE/api/ai/generate-content" || true)"
          echo "$AI"
          STATUS="$(printf '%s' "$AI" | sed -n 's/^HTTP_STATUS://p' | tail -1)"
          CTYPE="$(printf '%s' "$AI" | sed -n 's/^CONTENT_TYPE://p' | tail -1)"
          BODY="$(printf '%s' "$AI" | sed '/^HTTP_STATUS:/,$d')"
          [ "$STATUS" = '200' ]
          printf '%s' "$CTYPE" | grep -qi 'application/json'
          printf '%s' "$BODY" | grep -q '"success":true'
          printf '%s' "$BODY" | grep -q '"generalGoal"'
          echo 'GEMINI_GENERATION_OK'
